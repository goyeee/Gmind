<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · Gmind 在线协作脑图</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root {
    --ink:#1a1a1a; --ink2:#555; --ink3:#999; --line:#e8e8e6; --bg:#fdfdfc;
    --hover:#f0f0ee; --danger:#b3331f;
  }
  html,body { height:100%; }
  body { font-family:'Noto Sans SC',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }

  .page { min-height:100%; display:grid; grid-template-columns: 1fr 1fr; }

  /* ── 左：品牌区。唯一的视觉母题=脑图分枝，灰阶细线，从 logo 生长 ── */
  .brand { position:relative; display:flex; flex-direction:column; justify-content:center; padding:64px 72px; overflow:hidden; }
  .wordmark { display:flex; align-items:center; gap:12px; }
  .wordmark .glyph { width:34px; height:34px; border-radius:8px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; }
  .wordmark .name { font-size:22px; font-weight:700; letter-spacing:.5px; }
  .tagline { margin-top:22px; font-size:15px; color:var(--ink2); line-height:1.9; max-width:340px; }
  .tagline b { color:var(--ink); font-weight:500; }
  .brand-tree { position:absolute; right:-40px; bottom:-30px; width:520px; height:420px; opacity:.9; pointer-events:none; }
  .brand-tree .edge { fill:none; stroke:#e0e0dc; stroke-width:1.5; stroke-dasharray:400; stroke-dashoffset:400; animation:grow 1.6s ease-out forwards; }
  .brand-tree .edge.e2 { animation-delay:.25s; } .brand-tree .edge.e3 { animation-delay:.45s; }
  .brand-tree .edge.e4 { animation-delay:.6s; } .brand-tree .edge.e5 { animation-delay:.75s; }
  @keyframes grow { to { stroke-dashoffset:0; } }
  .brand-tree .nd { fill:#fff; stroke:#cfcfcb; stroke-width:1.2; opacity:0; animation:fadein .5s ease-out forwards; }
  .brand-tree .nd.n1 { animation-delay:.5s; } .brand-tree .nd.n2 { animation-delay:.7s; }
  .brand-tree .nd.n3 { animation-delay:.85s; } .brand-tree .nd.n4 { animation-delay:1s; } .brand-tree .nd.n5 { animation-delay:1.1s; }
  .brand-tree .nd.root { fill:var(--ink); stroke:var(--ink); }
  @keyframes fadein { to { opacity:1; } }
  .brand-meta { position:absolute; left:72px; bottom:40px; font-size:12px; color:var(--ink3); display:flex; gap:18px; }
  .brand-meta span { display:flex; align-items:center; gap:6px; }
  .brand-meta i { width:6px; height:6px; border-radius:50%; background:#c9c9c5; }

  /* ── 右：表单区 ── */
  .panel { display:flex; align-items:center; justify-content:center; padding:40px; background:#fff; border-left:1px solid var(--line); }
  .form { width:360px; }
  .form h1 { font-size:20px; font-weight:700; }
  .form .sub { margin-top:8px; font-size:13px; color:var(--ink3); }
  .field { margin-top:26px; }
  .field label { display:block; font-size:13px; color:var(--ink2); margin-bottom:8px; }
  .field .box { display:flex; align-items:center; border:1px solid var(--line); border-radius:8px; background:#fff; transition:border-color .15s, box-shadow .15s; }
  .field .box:focus-within { border-color:#b9b9b4; box-shadow:0 0 0 3px rgba(26,26,26,.06); }
  .field input { flex:1; border:none; outline:none; font-size:15px; font-family:inherit; color:var(--ink); padding:12px 14px; background:transparent; }
  .field input::placeholder { color:#c9c9c5; }
  .code-btn { flex:none; margin-right:6px; border:1px solid var(--line); background:#fff; border-radius:6px; font-size:13px; color:var(--ink2); padding:7px 12px; cursor:pointer; font-family:inherit; transition:.15s; }
  .code-btn:hover:not(:disabled) { border-color:#b9b9b4; color:var(--ink); }
  .code-btn:disabled { color:#c9c9c5; cursor:default; }
  .code-btn.counting { border-color:transparent; font-family:'JetBrains Mono',monospace; }
  .err { min-height:20px; margin-top:6px; font-size:12px; color:var(--danger); opacity:0; transition:opacity .15s; }
  .err.show { opacity:1; }
  .submit { width:100%; margin-top:8px; height:46px; border:none; border-radius:8px; background:var(--ink); color:#fff; font-size:15px; font-weight:500; font-family:inherit; cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .submit:hover:not(:disabled) { background:#333; }
  .submit:disabled { background:#c9c9c5; cursor:default; }
  .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .fine { margin-top:22px; font-size:12px; color:var(--ink3); line-height:1.8; text-align:center; }
  .fine .dev { display:inline-block; margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:11px; background:#f4f4f2; border:1px solid var(--line); border-radius:4px; padding:2px 8px; }

  .toast { position:fixed; left:50%; bottom:56px; transform:translateX(-50%) translateY(8px); background:#1a1a1a; color:#fff; font-size:13px; padding:9px 18px; border-radius:6px; opacity:0; transition:.2s; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%); }

  /* ── 移动端：单列，品牌区压缩为头部条 ── */
  @media (max-width: 820px) {
    .page { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .brand { padding:28px 24px 20px; }
    .brand-tree { display:none; }
    .tagline { margin-top:12px; font-size:14px; max-width:none; }
    .brand-meta { display:none; }
    .panel { border-left:none; border-top:1px solid var(--line); align-items:flex-start; padding:32px 24px; }
    .form { width:100%; max-width:420px; }
    .field input { font-size:16px; }
  }
</style>
</head>
<body>
<div class="page">
  <section class="brand">
    <div class="wordmark"><span class="glyph">G</span><span class="name">Gmind</span></div>
    <p class="tagline">浏览器端、协作为先的在线脑图。<br><b>50 人同屏编辑</b>，思路从中心生长，<br>每一根分枝都有人在场。</p>
    <svg class="brand-tree" viewBox="0 0 520 420" aria-hidden="true">
      <path class="edge e1" d="M420,340 C340,335 320,250 240,240"/>
      <path class="edge e2" d="M420,340 C350,345 330,180 250,160"/>
      <path class="edge e3" d="M240,240 C180,235 170,180 110,175"/>
      <path class="edge e4" d="M240,240 C180,245 175,310 115,315"/>
      <path class="edge e5" d="M250,160 C200,150 195,95 140,88"/>
      <rect class="nd root" x="406" y="326" width="30" height="30" rx="7"/>
      <rect class="nd n1" x="224" y="226" width="26" height="26" rx="6"/>
      <rect class="nd n2" x="236" y="146" width="26" height="26" rx="6"/>
      <rect class="nd n3" x="96"  y="162" width="22" height="22" rx="6"/>
      <rect class="nd n4" x="101" y="302" width="22" height="22" rx="6"/>
      <rect class="nd n5" x="127" y="76"  width="22" height="22" rx="6"/>
    </svg>
    <div class="brand-meta">
      <span><i></i>实时协同</span><span><i></i>XMind 互导</span><span><i></i>版本快照</span>
    </div>
  </section>

  <section class="panel">
    <form class="form" id="loginForm" novalidate>
      <h1>登录</h1>
      <p class="sub">手机号验证即登录，未注册将自动创建账号</p>

      <div class="field">
        <label for="phone">手机号</label>
        <div class="box">
          <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号" autocomplete="tel">
        </div>
        <div class="err" id="phoneErr">请输入 11 位手机号</div>
      </div>

      <div class="field" style="margin-top:14px">
        <label for="code">验证码</label>
        <div class="box">
          <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code">
          <button type="button" class="code-btn" id="codeBtn">获取验证码</button>
        </div>
        <div class="err" id="codeErr">验证码已发送，请查收短信</div>
      </div>

      <div class="field" style="margin-top:14px">
        <button type="submit" class="submit" id="submitBtn">登 录</button>
      </div>

      <p class="fine">登录即代表同意《服务条款》与《隐私政策》<br><span class="dev">开发环境 · 任意手机号 + 验证码 123456</span></p>
    </form>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const phone = document.getElementById('phone'), code = document.getElementById('code'),
      codeBtn = document.getElementById('codeBtn'), submitBtn = document.getElementById('submitBtn'),
      phoneErr = document.getElementById('phoneErr'), codeErr = document.getElementById('codeErr');
let counting = false;

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}
const validPhone = () => /^1\d{10}$/.test(phone.value.trim());
const validCode  = () => /^\d{6}$/.test(code.value.trim());
function refresh() {
  codeBtn.disabled = counting || !validPhone();
  submitBtn.disabled = !(validPhone() && validCode());
  phoneErr.classList.toggle('show', phone.value.length > 0 && !validPhone());
}
phone.addEventListener('input', refresh);
code.addEventListener('input', refresh);

codeBtn.addEventListener('click', () => {
  if (!validPhone()) return;
  counting = true; let left = 60;
  codeBtn.classList.add('counting');
  codeBtn.textContent = `${left}s`;
  codeErr.textContent = '验证码已发送，请查收短信'; codeErr.classList.add('show');
  const timer = setInterval(() => {
    left -= 1;
    if (left <= 0) {
      clearInterval(timer); counting = false;
      codeBtn.classList.remove('counting'); codeBtn.textContent = '重新获取';
      codeErr.classList.remove('show');
    } else codeBtn.textContent = `${left}s`;
    refresh();
  }, 1000);
  toast('验证码已发送（开发环境：123456）');
  refresh();
});

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!validPhone() || !validCode()) return;
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>登录中…';
  setTimeout(() => {
    if (code.value.trim() === '123456') {
      toast('登录成功，正在进入工作台…');
      submitBtn.innerHTML = '✓ 已登录';
    } else {
      submitBtn.disabled = false; submitBtn.innerHTML = '登 录';
      codeErr.textContent = '验证码错误，请重新输入'; codeErr.classList.add('show');
    }
  }, 900);
});
refresh();
</script>
</body>
</html>
