<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向二 · 调音台 — Gmind 编辑器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root {
    --ink:#101014; --paper:#ffffff;
    --c-insert:#3a5cff; --c-format:#00a86b; --c-task:#ff7a1a; --c-theme:#8b3dff; --c-export:#e63d68; --c-collab:#101014;
  }
  html,body { height:100%; }
  body { font-family:'Noto Sans SC',system-ui,sans-serif; color:var(--ink); background:#fff; overflow:hidden; font-size:14px; }

  /* ── 顶部色带工具栏 ── */
  .topbar { height:52px; display:flex; align-items:stretch; border-bottom:3px solid var(--ink); position:relative; z-index:20; }
  .brand { background:var(--ink); color:#fff; display:flex; align-items:center; gap:10px; padding:0 16px; cursor:pointer; }
  .brand .logo { font-family:'Space Grotesk','Noto Sans SC'; font-weight:700; font-size:17px; letter-spacing:.5px; }
  .brand .doc { font-size:13px; color:#cfcfd6; border-left:1px solid #3a3a44; padding-left:10px; }
  .brand .star { color:#6a6a76; cursor:pointer; } .brand .star.on { color:#ffd23d; }
  .seg { display:flex; align-items:center; gap:4px; padding:0 10px; cursor:default; position:relative; }
  .seg .seg-label { writing-mode:horizontal-tb; font-size:11px; font-weight:700; color:rgba(255,255,255,.85); margin-right:4px; letter-spacing:1px; }
  .seg button { width:32px; height:32px; border:none; background:rgba(255,255,255,.16); color:#fff; border-radius:4px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:.12s; }
  .seg button:hover { background:rgba(255,255,255,.34); transform:translateY(-1px); }
  .seg.insert { background:var(--c-insert); } .seg.format { background:var(--c-format); }
  .seg.task { background:var(--c-task); } .seg.theme { background:var(--c-theme); } .seg.export { background:var(--c-export); }
  .seg.collab { background:var(--c-collab); margin-left:auto; border-left:1px solid #3a3a44; }
  .seg.collab .seg-label { color:#9a9aa6; }
  .online-chip { background:#2ecc71; color:#08130c; font-weight:700; font-size:11px; border-radius:10px; padding:2px 8px; font-family:'Space Grotesk'; }
  .avatars { display:flex; }
  .avatar { width:26px; height:26px; border-radius:50%; border:2px solid var(--c-collab); display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; margin-left:-7px; }
  .avatar:first-child { margin-left:0; }

  /* ── 左侧黑轨 ── */
  .rail { position:absolute; left:0; top:52px; bottom:30px; width:46px; background:var(--ink); display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:10px; z-index:15; }
  .rail button { width:32px; height:32px; border-radius:6px; border:none; background:rgba(255,255,255,.1); color:#fff; font-size:15px; cursor:pointer; transition:.12s; position:relative; }
  .rail button:hover { background:rgba(255,255,255,.25); }
  .rail button.on { background:#fff; color:var(--ink); }
  .rail button::after { content:attr(data-tip); position:absolute; left:44px; top:50%; transform:translateY(-50%); background:var(--ink); color:#fff; font-size:12px; padding:4px 10px; border-radius:4px; white-space:nowrap; opacity:0; pointer-events:none; transition:.12s; }
  .rail button:hover::after { opacity:1; }
  .rail .gap { flex:1; }

  /* ── 画布 ── */
  .canvas-wrap { position:absolute; left:46px; right:0; top:52px; bottom:30px; overflow:hidden; background:#fafafa; cursor:grab; }
  svg text { user-select:none; }
  .node { cursor:pointer; }
  .node rect.body { transition:filter .12s; }
  .node:hover rect.body { filter:brightness(1.06); }
  .node.selected rect.body { stroke:#101014; stroke-width:3; }
  .edge { fill:none; stroke-width:3; stroke-linecap:round; }
  .edge.child { stroke-width:2; }

  /* ── 底部状态条 ── */
  .statusbar { position:absolute; left:0; right:0; bottom:0; height:30px; background:var(--ink); display:flex; align-items:center; padding:0 14px; gap:16px; z-index:20; font-family:'Space Grotesk','Noto Sans SC'; }
  .sig { display:flex; gap:2px; align-items:flex-end; height:12px; }
  .sig i { width:4px; background:#2ecc71; border-radius:1px; }
  .sig i:nth-child(1){height:4px} .sig i:nth-child(2){height:7px} .sig i:nth-child(3){height:10px} .sig i:nth-child(4){height:12px}
  .sig.saved i { animation:blink 2.4s infinite; }
  @keyframes blink { 50% { opacity:.45 } }
  .statusbar .txt { color:#9a9aa6; font-size:11px; letter-spacing:.5px; }
  .statusbar .txt b { color:#fff; }
  .view-tabs { display:flex; background:#26262e; border-radius:5px; padding:2px; margin-left:6px; }
  .view-tab { font-size:11px; color:#9a9aa6; padding:3px 12px; border-radius:4px; cursor:pointer; font-weight:700; }
  .view-tab.on { background:#fff; color:var(--ink); }
  .zoomctl { margin-left:auto; display:flex; align-items:center; gap:2px; }
  .zoomctl button { width:24px; height:22px; border:none; background:#26262e; color:#fff; border-radius:4px; cursor:pointer; font-size:12px; }
  .zoomctl .zl { color:#fff; font-size:11px; min-width:44px; text-align:center; font-weight:700; }

  /* ── 下拉面板（色块卡） ── */
  .pop { position:absolute; top:56px; min-width:230px; background:#fff; border:2.5px solid var(--ink); border-radius:8px; box-shadow:6px 6px 0 rgba(16,16,20,.9); display:none; z-index:40; overflow:hidden; }
  .pop.show { display:block; animation:pop .13s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(-4px); } }
  .pop .pop-head { padding:8px 12px; color:#fff; font-size:12px; font-weight:700; letter-spacing:1px; display:flex; align-items:center; }
  .pop .pop-head .x { margin-left:auto; cursor:pointer; opacity:.8; }
  .pop .item { display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:13px; cursor:pointer; border-top:1px solid #eee; }
  .pop .item:hover { background:#f4f4f7; }
  .pop .item .kbd { margin-left:auto; font-family:'Space Grotesk'; font-size:10px; color:#999; }
  .theme-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px; }
  .theme-cell { height:38px; border-radius:5px; border:2px solid transparent; cursor:pointer; display:flex; align-items:flex-end; padding:3px 5px; font-size:9px; font-weight:700; color:#fff; }
  .theme-cell.on { border-color:var(--ink); }

  /* ── 右键菜单 ── */
  .ctx { position:fixed; min-width:210px; background:#fff; border:2.5px solid var(--ink); border-radius:8px; box-shadow:6px 6px 0 rgba(16,16,20,.9); padding:6px; display:none; z-index:70; }
  .ctx.show { display:block; }
  .ctx .item { display:flex; gap:10px; padding:8px 10px; font-size:13px; border-radius:5px; cursor:pointer; align-items:center; }
  .ctx .item:hover { background:var(--c-insert); color:#fff; }
  .ctx .item .dotc { width:8px; height:8px; border-radius:2px; }
  .ctx .item .kbd { margin-left:auto; font-family:'Space Grotesk'; font-size:10px; color:#999; }
  .ctx .item:hover .kbd { color:rgba(255,255,255,.8); }
  .ctx .sep { height:2px; background:#eee; margin:5px 4px; }

  .toast { position:fixed; left:50%; bottom:52px; transform:translateX(-50%) translateY(8px); background:var(--ink); color:#fff; font-size:13px; font-weight:500; padding:9px 18px; border-radius:6px; opacity:0; transition:.2s; z-index:80; pointer-events:none; border-left:6px solid var(--c-format); }
  .toast.show { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" id="brandHome" title="返回工作台">
    <span class="logo">◆ Gmind</span>
    <span class="doc">产品功能地图</span>
    <span class="star" id="star">★</span>
  </div>
  <div class="seg insert"><span class="seg-label">插入</span>
    <button data-cmd="插入子级主题">⤵</button><button data-cmd="插入同级主题">→</button><button data-cmd="插入上级主题">⤴</button><button data-cmd="添加概要">∑</button>
  </div>
  <div class="seg format"><span class="seg-label">格式</span>
    <button data-cmd="撤销">↺</button><button data-cmd="重做">↻</button><button data-cmd="格式刷">▦</button><button data-cmd="查找替换">⌕</button>
  </div>
  <div class="seg task"><span class="seg-label">任务</span>
    <button data-cmd="指派负责人">👤</button><button data-cmd="设置进度">◔</button><button data-cmd="预期日期">📅</button>
  </div>
  <div class="seg theme" id="themeSeg"><span class="seg-label">主题</span>
    <button data-pop="themePop">❖</button><button data-cmd="结构切换">◈</button><button data-cmd="简洁模式">◐</button>
  </div>
  <div class="seg export" id="exportSeg"><span class="seg-label">导出</span>
    <button data-pop="exportPop">⇪</button>
  </div>
  <div class="seg collab">
    <span class="online-chip">● 3</span>
    <span class="avatars">
      <span class="avatar" style="background:#3a5cff">林</span>
      <span class="avatar" style="background:#ff7a1a">周</span>
      <span class="avatar" style="background:#8b3dff">郭</span>
    </span>
    <button data-cmd="版本历史" title="版本历史">⏱</button>
    <button data-cmd="文档动态" title="文档动态">≡</button>
    <button data-cmd="评论" title="评论">💬</button>
  </div>
</header>

<nav class="rail">
  <button class="on" data-tip="脑图画布">◉</button>
  <button data-tip="标记选盘">🏷</button>
  <button data-tip="任务面板">☑</button>
  <button data-tip="评论线程">💬</button>
  <button data-tip="通知中心">🔔</button>
  <span class="gap"></span>
  <button data-tip="快捷键 ⌘/">⌨</button>
  <button data-tip="新手引导">?</button>
</nav>

<div class="canvas-wrap" id="canvasWrap"><svg id="stage" width="100%" height="100%"></svg></div>

<footer class="statusbar">
  <span class="sig saved"><i></i><i></i><i></i><i></i></span>
  <span class="txt" id="saveTxt">SAVED <b>14:32</b></span>
  <span class="txt">NODES <b>42</b></span>
  <div class="view-tabs">
    <span class="view-tab on">脑图</span><span class="view-tab" id="tabTable">表格</span>
  </div>
  <div class="zoomctl">
    <button data-act="center">⌖</button><button data-act="fit">□</button>
    <button data-act="zout">−</button><span class="zl" id="zoomLabel">100%</span><button data-act="zin">＋</button>
    <button data-act="full">⛶</button>
  </div>
</footer>

<!-- 主题弹层 -->
<div class="pop" id="themePop" style="right:260px">
  <div class="pop-head" style="background:var(--c-theme)">12 套主题 <span class="x" data-close>✕</span></div>
  <div class="theme-grid" id="themeGrid"></div>
</div>
<!-- 导出弹层 -->
<div class="pop" id="exportPop" style="right:170px">
  <div class="pop-head" style="background:var(--c-export)">导出 <span class="x" data-close>✕</span></div>
  <div class="item">📦 XMind 文件 <span class="kbd">.xmind</span></div>
  <div class="item">🖼 PNG · 1x / 2x / 3x <span class="kbd">透明背景可选</span></div>
  <div class="item">🖼 JPG · 1x / 2x / 3x</div>
</div>

<div class="ctx" id="ctx"></div>
<div class="toast" id="toast"></div>

<script>
const TREE = {
  id:'root', text:'Gmind', children:[
    { text:'协同编辑', color:'#3a5cff', children:[{text:'50 人实时协同'},{text:'远端光标与头像'},{text:'离线缓存自动同步'}] },
    { text:'编辑内核', color:'#00a86b', children:[{text:'同级 · 子级 · 上级插入'},{text:'标记 · 概要 · 格式刷'},{text:'节点图文四槽位'}] },
    { text:'任务管理', color:'#ff7a1a', task:{p:60}, children:[{text:'负责人指派'},{text:'9 档进度',task:{p:40}},{text:'预期日期 · 逾期提醒'},{text:'表格视图'}] },
    { text:'文件与分享', color:'#00b3c7', children:[{text:'XMind 导入导出'},{text:'PNG / JPG 多倍导出'},{text:'分享链接 · 回收站'}] },
    { text:'团队与历史', color:'#8b3dff', children:[{text:'评论线程与定位'},{text:'通知中心'},{text:'版本快照一键恢复'},{text:'文档动态'}] },
    { text:'个性化', color:'#e63d68', children:[{text:'12 套主题'},{text:'结构切换 · 简洁模式'},{text:'快捷键 · 新手引导'}] },
  ]
};
const svg = document.getElementById('stage');
const NS = 'http://www.w3.org/2000/svg';
let zoom = 1;
function measure(t, s, w) { const c=document.createElement('canvas').getContext('2d'); c.font=`${w||500} ${s}px 'Noto Sans SC'`; return c.measureText(t).width; }
function el(tag, attrs) { const e=document.createElementNS(NS,tag); for (const k in attrs) e.setAttribute(k,attrs[k]); return e; }

function layout() {
  const W = document.getElementById('canvasWrap').clientWidth, H = document.getElementById('canvasWrap').clientHeight;
  const nodes=[], edges=[];
  const root = { text:TREE.text, x:W/2-45, y:H/2-22, w:90, h:44, depth:0 };
  nodes.push(root);
  const left = TREE.children.filter((_,i)=>i%2===0), right = TREE.children.filter((_,i)=>i%2===1);
  function side(list, dir) {
    const spans = list.map(b => Math.max(b.children.length,1)*48+34);
    const total = spans.reduce((a,b)=>a+b,0);
    let y = H/2 - total/2;
    list.forEach((b,i) => {
      const bw = measure(b.text,15,700)+40, bh=34, span=spans[i];
      const bx = W/2 + dir*(45+150) + (dir>0?0:-bw), by = y+span/2-bh/2;
      nodes.push({ ...b, x:bx, y:by, w:bw, h:bh, depth:1 });
      edges.push({ x1:root.x+(dir>0?90:0), y1:root.y+22, x2:bx+(dir>0?0:bw), y2:by+bh/2, color:b.color });
      const cwidMax = Math.max(...b.children.map(c=>measure(c.text,13,400)+32));
      b.children.forEach((c,ci) => {
        const cw = measure(c.text,13,400)+32, ch=28;
        const cx = bx + (dir>0 ? bw+96 : -96-cwidMax) + (cwidMax-cw)/2;
        const cy = y + 30 + ci*48 + 12;
        nodes.push({ ...c, x:cx, y:cy, w:cw, h:ch, depth:2, color:b.color });
        edges.push({ x1:bx+(dir>0?bw:0), y1:by+bh/2, x2:cx+(dir>0?0:cw), y2:cy+ch/2, color:b.color, child:true });
      });
      y += span;
    });
  }
  side(left,-1); side(right,1);
  return { nodes, edges, rootCx:W/2 };
}

function render() {
  const { nodes, edges } = layout();
  svg.innerHTML='';
  const g = el('g',{ transform:`scale(${zoom})` });
  edges.forEach(e => {
    const mx=(e.x1+e.x2)/2;
    g.appendChild(el('path',{ class:'edge'+(e.child?' child':''), stroke:e.color, d:`M${e.x1},${e.y1} C${mx},${e.y1} ${mx},${e.y2} ${e.x2},${e.y2}` }));
  });
  nodes.forEach(n => {
    const grp = el('g',{ class:'node','data-text':n.text });
    const isRoot = n.depth===0, isB = n.depth===1;
    grp.appendChild(el('rect',{ class:'body', x:n.x, y:n.y, width:n.w, height:n.h, rx:isRoot?8:6,
      fill: isRoot ? '#101014' : (isB ? n.color : '#fff'),
      stroke: isB||isRoot ? 'none' : n.color, 'stroke-width':2 }));
    const t = el('text',{ x:n.x+n.w/2, y:n.y+n.h/2+(isRoot?6:5), 'text-anchor':'middle',
      'font-size': isRoot?17:(isB?15:13), 'font-weight': isRoot||isB?700:400,
      fill: isRoot||isB ? '#fff' : '#101014', 'font-family': isRoot? "'Space Grotesk','Noto Sans SC'" : "'Noto Sans SC'" });
    t.textContent = n.text; grp.appendChild(t);
    if (n.task) {
      const ty = n.y+n.h+6;
      grp.appendChild(el('rect',{ x:n.x, y:ty, width:n.w, height:5, rx:2.5, fill:'#eee' }));
      grp.appendChild(el('rect',{ x:n.x, y:ty, width:n.w*n.task.p/100, height:5, rx:2.5, fill:'#101014' }));
    }
    grp.addEventListener('click', ev => { ev.stopPropagation();
      svg.querySelectorAll('.node.selected').forEach(x=>x.classList.remove('selected'));
      grp.classList.add('selected'); toast(`已选中：${n.text}`); });
    grp.addEventListener('contextmenu', ev => { ev.preventDefault(); ev.stopPropagation(); openCtx(ev.clientX, ev.clientY); });
    g.appendChild(grp);
  });
  svg.appendChild(g);
}

/* 弹层 */
function closePops() { document.querySelectorAll('.pop').forEach(p=>p.classList.remove('show')); }
document.querySelectorAll('[data-pop]').forEach(btn => btn.addEventListener('click', e => {
  e.stopPropagation();
  const p = document.getElementById(btn.dataset.pop);
  const was = p.classList.contains('show'); closePops();
  if (!was) p.classList.add('show');
}));
document.querySelectorAll('[data-close]').forEach(x => x.onclick = closePops);
document.addEventListener('click', e => { if (!e.target.closest('.pop')) closePops(); if (!e.target.closest('.ctx')) closeCtx(); });
document.querySelectorAll('.pop .item').forEach(i => i.onclick = () => { closePops(); toast('已执行：'+i.textContent.trim().split(/\s+/).slice(0,2).join(' ')); });

const THEMES = [
  ['经典蓝','#3a5cff'],['森林','#00a86b'],['橘子','#ff7a1a'],['葡萄','#8b3dff'],
  ['蔷薇','#e63d68'],['青屿','#00b3c7'],['墨夜','#101014'],['琥珀','#d4a017'],
  ['青瓷','#5a8f7b'],['山雾','#7c8b9e'],['朱砂','#c3271f'],['藤黄','#c79a3d'],
];
const tg = document.getElementById('themeGrid');
THEMES.forEach(([name,c],i) => {
  const d = document.createElement('div'); d.className='theme-cell'+(i===0?' on':''); d.style.background=c; d.textContent=name;
  d.onclick = () => { tg.querySelectorAll('.theme-cell').forEach(x=>x.classList.remove('on')); d.classList.add('on'); toast(`主题已切换：${name}`); };
  tg.appendChild(d);
});

/* 右键菜单 */
const ctx = document.getElementById('ctx');
const CTX = [
  ['插入子级主题','Tab','#3a5cff'],['插入同级主题','Enter','#3a5cff'],['添加概要','','#3a5cff'],null,
  ['复制','⌘C','#00a86b'],['剪切','⌘X','#00a86b'],['粘贴','⌘V','#00a86b'],null,
  ['删除节点','⌫','#e63d68'],
];
function openCtx(x,y) {
  ctx.innerHTML='';
  CTX.forEach(i => {
    if (!i) { const s=document.createElement('div'); s.className='sep'; ctx.appendChild(s); return; }
    const r=document.createElement('div'); r.className='item';
    r.innerHTML = `<span class="dotc" style="background:${i[2]}"></span>${i[0]}<span class="kbd">${i[1]}</span>`;
    r.onclick = () => { closeCtx(); toast('已执行：'+i[0]); };
    ctx.appendChild(r);
  });
  ctx.style.left = Math.min(x, innerWidth-230)+'px'; ctx.style.top = Math.min(y, innerHeight-320)+'px';
  ctx.classList.add('show');
}
function closeCtx(){ ctx.classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key==='Escape'){ closeCtx(); closePops(); } });

/* 杂项 */
document.querySelectorAll('.seg button[data-cmd], .rail button').forEach(b => b.addEventListener('click', () => {
  toast('已执行：' + (b.dataset.cmd || b.dataset.tip || ''));
  if (b.closest('.rail')) { b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }
}));
document.getElementById('star').onclick = function(e){ e.stopPropagation(); this.classList.toggle('on'); toast(this.classList.contains('on')?'已加星标':'已取消星标'); };
document.getElementById('brandHome').onclick = () => toast('返回工作台');
document.getElementById('tabTable').onclick = function(){ document.querySelectorAll('.view-tab').forEach(x=>x.classList.remove('on')); this.classList.add('on'); toast('已切换到表格视图'); };
document.querySelector('.view-tab.on').onclick = function(){ document.querySelectorAll('.view-tab').forEach(x=>x.classList.remove('on')); this.classList.add('on'); toast('已切换到脑图视图'); };
document.querySelectorAll('.zoomctl button').forEach(b => b.onclick = () => {
  const a=b.dataset.act;
  if (a==='zin') zoom=Math.min(3,zoom+0.1);
  if (a==='zout') zoom=Math.max(0.25,zoom-0.1);
  if (a==='full') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (a==='center'||a==='fit') { zoom=1; toast(a==='center'?'已回到中心':'已适应画布'); }
  document.getElementById('zoomLabel').textContent = Math.round(zoom*100)+'%';
  render();
});
document.getElementById('canvasWrap').addEventListener('click', () => svg.querySelectorAll('.node.selected').forEach(x=>x.classList.remove('selected')));
let toastTimer;
